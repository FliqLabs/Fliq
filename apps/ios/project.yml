name: Fliq

configs:
  Debug: debug
  Release: release
  Mainnet: debug

options:
  bundleIdPrefix: cash.fliq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "1.0"

targets:
  Fliq:
    type: application
    platform: iOS
    sources:
      - path: Fliq
      - path: ../../spec/fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      Mainnet: Config/Mainnet.xcconfig
    info:
      path: Fliq/Info.plist
      properties:
        CFBundleDisplayName: $(FLIQ_DISPLAY_NAME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        FliqAPIBaseURL: $(FLIQ_API_BASE_URL)
        FliqAPIKey: $(FLIQ_API_KEY)
        FliqDataSource: $(FLIQ_DATA_SOURCE)
        FliqNameSuffix: $(FLIQ_NAME_SUFFIX)
        FliqNearRPCURL: $(FLIQ_NEAR_RPC_URL)
        FliqNearNetwork: $(FLIQ_NEAR_NETWORK)
        FliqCloudinaryCloud: $(FLIQ_CLOUDINARY_CLOUD)
        FliqCloudinaryPreset: $(FLIQ_CLOUDINARY_PRESET)
        FliqWebBaseURL: $(FLIQ_WEB_BASE_URL)
        FliqPajTestRecipient: $(FLIQ_PAJ_TEST_RECIPIENT)
        NSFaceIDUsageDescription: fliq asks for Face ID before any money leaves your vault.
        NSLocalNetworkUsageDescription: fliq connects to a fliq server on this network during development.
        NSCameraUsageDescription: fliq uses the camera to scan payment codes and take your profile photo.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: cash.fliq.app
            CFBundleURLSchemes: [fliq]
    entitlements:
      path: Fliq/Fliq.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:fliq.cash$(FLIQ_ASSOCIATED_DOMAIN_MODE)
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLIQ_BUNDLE_ID)
        DEVELOPMENT_TEAM: YCKKUWB4WD
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - FliqTests
        - FliqUITests

  FliqTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FliqTests
    dependencies:
      - target: Fliq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FliqUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FliqUITests
    dependencies:
      - target: Fliq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fliq

schemes:
  Fliq Mainnet:
    build:
      targets:
        Fliq: all
    run:
      config: Mainnet
    profile:
      config: Mainnet
    archive:
      config: Mainnet
