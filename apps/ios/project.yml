name: Fliq

options:
  bundleIdPrefix: cash.fliq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Fliq:
    type: application
    platform: iOS
    sources:
      - path: Fliq
      - path: ../../spec/fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Fliq/Info.plist
      properties:
        CFBundleDisplayName: fliq
        FliqAPIBaseURL: $(FLIQ_API_BASE_URL)
        FliqAPIKey: $(FLIQ_API_KEY)
        FliqDataSource: $(FLIQ_DATA_SOURCE)
        NSFaceIDUsageDescription: fliq asks for Face ID before any money leaves your vault.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cash.fliq.app
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - FliqTests
        - FliqUITests

  FliqTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FliqTests
    dependencies:
      - target: Fliq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FliqUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FliqUITests
    dependencies:
      - target: Fliq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fliq
