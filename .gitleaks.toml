[extend]
useDefault = true

[allowlist]
description = "Published demo keys for mock mode, and public token contract addresses. None of them are secrets."
regexes = [
  '''rt_test_7Kp2demo00c9Qe''',
  '''rt_test_mcp_Q8demo001fA''',
  # USDC token contract on Base, public on every explorer. Watcher tests use it.
  '''(?i)0x833589fcd6edb6e08f4c7c32d4f71b54bda02913''',
  # An empty ONECLICK_API_KEY= in services/api/.env.example (f6f28ed) makes the generic rule
  # read the next line, a public NEAR fee-recipient account, as the key.
  '''^ONECLICK_FEE_RECIPIENT=''',
  # The made-up passkey id in spec/fixtures/passkeys.list.json (87f2850).
  '''pk_01jbd0a1b2c3d4e5f6g7h8j9k1''',
  # The sample Idempotency-Key in the web docs pages on the moonlight-frontend branch (42b85e7). Gitleaks scans
  # every branch, so it failed the secret scan on every pull request.
  '''payroll-2026-11-05-dara''',
]
