openapi: 3.1.0
info:
  title: fliq API
  version: 0.1.0
  description: Stablecoin to local money payouts. Quotes the best after-fee rate across licensed providers and pays out to bank and mobile money accounts.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.fliq.cash/v1
    description: Production
  - url: http://localhost:4000/v1
    description: Local mock (make dev-mock)
security:
  - bearerAuth: []
tags:
  - name: rates
    description: Public rates, no key needed
  - name: quotes
    description: Best after-fee quotes across providers
  - name: institutions
    description: Banks and account verification
  - name: payouts
    description: Create and track payouts
  - name: status
    description: Public health of services and providers
  - name: vault
    description: The user's vault balance
  - name: deposits
    description: Topping up the vault from other chains through NEAR Intents
  - name: people
    description: Other fliq users, for paying by name
  - name: recipients
    description: Saved accounts the user pays often
  - name: auth
    description: Passkey and email-link sign-in, sessions
  - name: accounts
    description: The signed-in user, their fliq name and profile
  - name: workspaces
    description: Developer workspaces and sandbox keys
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /rates/{token}/{currency}:
    get:
      operationId: getRate
      summary: Best after-fee rate for a corridor
      tags: [rates]
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/Currency"
      description: Prices a 100 token payout through every eligible provider and returns the best route's rate. The official, p2p and change_24h reference fields are present only when a market source is connected.
      responses:
        "200":
          description: Best after-fee rate right now, cached for 10 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rate"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rates/{token}/{currency}/providers:
    get:
      operationId: getRateBoard
      summary: Every provider's rate, fee and status for a corridor
      tags: [rates]
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/Currency"
      description: >-
        Prices the same 100 token payout as GET /rates/{token}/{currency} through every provider, best first.
        A stale provider did not answer this time and shows its last sampled rate; a paused one is held back by its
        circuit breaker.
      responses:
        "200":
          description: All providers for the corridor, cached for 10 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateBoard"
        "400":
          $ref: "#/components/responses/Error"
  /rates/{token}/{currency}/history:
    get:
      operationId: getRateHistory
      summary: Best and worst after-fee rates over time, for the rate chart
      tags: [rates]
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/Currency"
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
      description: >-
        Built from a sample of every provider taken once a minute and kept 90 days. Points are 15 minutes apart for
        24h, an hour for 7d and 4 hours for 30d. A period with no sample has no point.
      responses:
        "200":
          description: Points oldest first, cached for 60 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateHistory"
        "400":
          $ref: "#/components/responses/Error"
  /quote:
    post:
      operationId: createQuote
      summary: Quote a payout
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Best after-fee quote across providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /quotes:
    post:
      operationId: requestQuote
      summary: Quote every provider and rank the routes
      description: Runs every eligible provider in parallel under a 1.5 second budget. The best route is returned as the quote and every route is stored with its score breakdown.
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The ranked quote. It holds until expires_in runs out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          description: No provider can pay this out right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /institutions:
    get:
      operationId: listInstitutions
      summary: Banks and mobile-money providers for a country
      tags: [institutions]
      security: []
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
            enum: [ng, ke, gh, id, ph]
            default: ng
      responses:
        "200":
          description: Institutions the app can offer, with the logo key to show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionList"
        "400":
          $ref: "#/components/responses/Error"
  /accounts/verify:
    post:
      operationId: verifyAccountName
      summary: Ask the bank for the name on an account
      tags: [institutions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLookup"
      responses:
        "200":
          description: The name as returned by the bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedAccount"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /recipients:
    get:
      operationId: listRecipients
      summary: The user's saved recipients, newest first
      tags: [recipients]
      responses:
        "200":
          description: Saved recipients. Account numbers are never returned in full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientList"
    post:
      operationId: saveRecipient
      summary: Verify an account with the bank and save it
      description: Saving an account that is already saved returns the existing recipient.
      tags: [recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLookup"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "200":
          description: Already saved, the existing recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /recipients/{recipientId}:
    delete:
      operationId: deleteRecipient
      summary: Remove a saved recipient
      tags: [recipients]
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"
  /status:
    get:
      operationId: getStatus
      summary: Service and provider health for the status page
      description: |
        Each component has one entry per UTC calendar day for the last 60 days, oldest first, and a current state.
        A day is an outage when 5% or more of its checks failed, degraded when any check was not clean, operational otherwise,
        and no_data when nothing ran. Incidents open after three failed checks in a row and close after three clean ones.
        Cached for 10 seconds.
      tags: [status]
      security: []
      responses:
        "200":
          description: Components with their daily bars, and recent incidents, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusReport"
  /vault:
    get:
      operationId: getVaultBalance
      summary: The user's vault balance, free and reserved
      description: The chain is authoritative. in_sync says whether the ledger mirror agrees with it.
      tags: [vault]
      responses:
        "200":
          description: Balance in USDC as decimal strings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultBalance"
        "404":
          $ref: "#/components/responses/Error"
  /deposits/sources:
    get:
      operationId: listDepositSources
      summary: The tokens and chains the vault can be topped up from
      description: >-
        Every source the app shows, in display order. A source that is not available right now is still listed,
        with available false. A direct source is the user's own NEAR account: there is nothing to reserve,
        so it carries the address and POST /deposits refuses it.
      tags: [deposits]
      responses:
        "200":
          description: Sources in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositSourceList"
        "404":
          $ref: "#/components/responses/Error"
  /deposits/estimate:
    get:
      operationId: estimateDeposit
      summary: What a top-up of about this amount lands as, and how long it takes
      description: Nothing is reserved. Use it while the user types the amount.
      tags: [deposits]
      parameters:
        - $ref: "#/components/parameters/DepositToken"
        - $ref: "#/components/parameters/DepositChain"
        - name: amount
          in: query
          required: true
          description: Amount of the source token, as a decimal string
          schema:
            type: string
      responses:
        "200":
          description: The estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositEstimate"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /deposits:
    post:
      operationId: createDeposit
      summary: Reserve a deposit address for one top-up
      description: >-
        The address takes any amount from minimum up and lands it in the vault as USDC. It is watched until
        reserved_until. A deposit below minimum, or one that cannot be completed, is refunded to the user's
        NEAR account, so nothing sent is lost.
      tags: [deposits]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "201":
          description: Address reserved, waiting for the transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDeposit"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /deposits/{depositId}:
    get:
      operationId: getDeposit
      summary: Where a top-up is
      description: Poll every few seconds while the app shows it. Each step carries the time it was seen.
      tags: [deposits]
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The top-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDeposit"
        "404":
          $ref: "#/components/responses/Error"
  /people/recent:
    get:
      operationId: listRecentPeople
      summary: People on fliq the user has paid, most recent first
      tags: [people]
      responses:
        "200":
          description: Up to 10 people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentPeopleList"
  /people/{name}:
    get:
      operationId: lookupPerson
      summary: Find a person on fliq by name before paying them
      tags: [people]
      parameters:
        - name: name
          in: path
          required: true
          description: A fliq name such as tobi, or the full account tobi.fliq.near
          schema:
            type: string
      responses:
        "200":
          description: Who the name belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/Error"
  /institutions/verify:
    post:
      operationId: verifyAccount
      summary: Verify a bank account name
      tags: [institutions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
      responses:
        "200":
          description: Account name as returned by the bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedAccount"
        "404":
          $ref: "#/components/responses/Error"
  /payouts:
    get:
      operationId: listPayouts
      summary: List the workspace's payouts, newest first
      tags: [payouts]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          description: next_cursor from the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of payouts. Empty for a new workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPayout
      summary: Create a payout
      tags: [payouts]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutRequest"
      responses:
        "400":
          $ref: "#/components/responses/Error"
        "201":
          description: Payout created, waiting for the deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: Refused by the vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /payouts/stats:
    get:
      operationId: getPayoutStats
      summary: Today's payout numbers for the dashboard cards
      description: Timestamps are stored in UTC. "Today" is the calendar day in the tz query parameter.
      tags: [payouts]
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA time zone of the person looking, for example Africa/Lagos. Defaults to UTC.
          schema:
            type: string
      responses:
        "200":
          description: Settled and refused payouts today, and the median time to the bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutStats"
        "400":
          $ref: "#/components/responses/Error"
  /payouts/{payoutId}:
    get:
      operationId: getPayout
      summary: Get a payout and its receipt
      tags: [payouts]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The payout and its receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "404":
          $ref: "#/components/responses/Error"
  /payouts/{payoutId}/retry-quote:
    post:
      operationId: quoteRetry
      summary: Quote the same payout again without the provider that could not pay it
      description: >-
        For a refunded, failed or expired payout. Same amount, currency and source; the provider that failed is
        left out. Pay it with POST /payouts, passing this quote_id and retry_of.
      tags: [payouts]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A fresh quote. routes[0] is the next best provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /payouts/{payoutId}/claims:
    post:
      operationId: openPayoutClaim
      summary: Tell support a settled payout has not reached the account
      description: >-
        Opens one claim per payout; asking again returns the open claim. Support chases the bank with the
        bank reference. A credit that never lands is reversed by the bank rail and refunded.
      tags: [payouts]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Claim opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutClaim"
        "200":
          description: A claim was already open; this is it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutClaim"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/passkeys/register/options:
    post:
      operationId: startPasskeyRegistration
      summary: Start creating a passkey for a new user
      tags: [auth]
      security: []
      responses:
        "200":
          description: WebAuthn creation options and the challenge to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
  /auth/passkeys/register/verify:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish passkey registration and open a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredential"
      responses:
        "201":
          description: User created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
  /auth/passkeys/login/options:
    post:
      operationId: startPasskeyLogin
      summary: Start signing in with an existing passkey
      tags: [auth]
      security: []
      responses:
        "200":
          description: WebAuthn request options and the challenge to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
  /auth/passkeys/login/verify:
    post:
      operationId: finishPasskeyLogin
      summary: Finish passkey sign-in and open a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCredential"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /auth/email-links:
    post:
      operationId: sendEmailLink
      summary: Email a one-time sign-in link
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLinkRequest"
      responses:
        "202":
          description: Accepted. The response is identical whether or not the email has an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLinkSent"
        "429":
          $ref: "#/components/responses/Error"
  /auth/email-links/verify:
    post:
      operationId: verifyEmailLink
      summary: Exchange a sign-in link token for a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLinkToken"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens. Reusing an old refresh token revokes the whole session family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [accounts]
      responses:
        "200":
          description: The user, with their fliq name once claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Set the display name and what the user does
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
  /names/{name}:
    get:
      operationId: checkName
      summary: Is a fliq name free to claim
      tags: [accounts]
      parameters:
        - name: name
          in: path
          required: true
          description: The label before .fliq.near
          schema:
            type: string
      responses:
        "200":
          description: Availability of the name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameAvailability"
  /me/name:
    post:
      operationId: claimName
      summary: Claim a fliq name and create the NEAR account and vault behind it
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimNameRequest"
      responses:
        "201":
          description: Name claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Error"
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create a developer workspace and its first sandbox key
      tags: [workspaces]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRequest"
      responses:
        "201":
          description: Workspace created. The sandbox key is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreated"
        "400":
          $ref: "#/components/responses/Error"
  /workspaces/current:
    get:
      operationId: getCurrentWorkspace
      summary: The signed-in user's workspace
      tags: [workspaces]
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/Error"
  /keys:
    get:
      operationId: listKeys
      summary: API keys of the workspace, masked
      tags: [workspaces]
      responses:
        "200":
          description: Active keys. The full key is only shown at creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        "404":
          $ref: "#/components/responses/Error"
  /onboarding:
    get:
      operationId: getOnboarding
      summary: Progress through the dashboard's getting-started steps
      tags: [workspaces]
      responses:
        "200":
          description: Each step and whether it is done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: rt_test_ keys for sandbox, rt_live_ keys after KYB. Signed-in users send their access token the same way.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    DepositToken:
      name: token
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/DepositTokenId"
    DepositChain:
      name: chain
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/DepositChainId"
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
        enum: [usdc, usdt]
    Currency:
      name: currency
      in: path
      required: true
      schema:
        type: string
        enum: [ngn, kes, ghs, idr, php]
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ProviderId:
      type: string
      enum: [paycrest, busha, fonbnk, bitnob, transfi, mock]
    ProviderStatus:
      type: string
      enum: [live, stale, paused]
    ProviderRate:
      type: object
      required: [provider, status, rate, rate_before_fees, fee, fee_percent, receive, eta_seconds, on_time_percent, updated_at, not_offered_reason]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        status:
          $ref: "#/components/schemas/ProviderStatus"
        rate:
          type: [number, "null"]
          description: Local currency per 1 token after every fee. For a stale provider, its last sampled rate.
        rate_before_fees:
          type: [number, "null"]
        fee:
          type: [number, "null"]
          description: Every fee on the reference amount, in local currency
        fee_percent:
          type: [number, "null"]
          description: fee as a share of the amount before fees, in percent
        receive:
          type: [number, "null"]
          description: Local currency the reference amount lands as, whole units
        eta_seconds:
          type: [integer, "null"]
        on_time_percent:
          type: [integer, "null"]
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When this provider's figures were priced. Null for a paused provider never sampled.
        not_offered_reason:
          type: [string, "null"]
          enum: [breaker_open, half_open_over_limit, timeout, error, null]
    RateBoard:
      type: object
      required: [token, currency, amount, best, fetched_at, providers]
      properties:
        token:
          type: string
        currency:
          type: string
        amount:
          type: string
          description: The reference amount priced, in the token
        best:
          oneOf:
            - $ref: "#/components/schemas/ProviderId"
            - type: "null"
        fetched_at:
          type: string
          format: date-time
        providers:
          type: array
          description: Live providers best first, then stale, then paused
          items:
            $ref: "#/components/schemas/ProviderRate"
    RatePoint:
      type: object
      required: [at, best, worst, p2p]
      properties:
        at:
          type: string
          format: date-time
          description: Start of the period
        best:
          type: number
          description: The best provider's after-fee rate, averaged over the period
        worst:
          type: number
          description: The worst quoting provider's after-fee rate, averaged over the period
        p2p:
          type: [number, "null"]
          description: Present only when a market source is connected
    RateHistory:
      type: object
      required: [token, currency, range, interval_seconds, points]
      properties:
        token:
          type: string
        currency:
          type: string
        range:
          type: string
          enum: [24h, 7d, 30d]
        interval_seconds:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/RatePoint"
    ReferenceRate:
      type: object
      required: [source, rate]
      properties:
        source:
          type: string
        rate:
          type: number
    Rate:
      type: object
      required:
        [
          token,
          currency,
          rate,
          rate_before_fees,
          provider,
          providers_quoting,
          spread,
          fetched_at,
        ]
      properties:
        token:
          type: string
        currency:
          type: string
        rate:
          type: number
          description: Local currency per 1 token, after fees
        rate_before_fees:
          type: number
        provider:
          $ref: "#/components/schemas/ProviderId"
        providers_quoting:
          type: integer
        spread:
          type: number
        official:
          $ref: "#/components/schemas/ReferenceRate"
        p2p:
          $ref: "#/components/schemas/ReferenceRate"
        change_24h:
          type: number
        fetched_at:
          type: string
          format: date-time
    QuoteRequest:
      type: object
      required: [token, currency, amount]
      properties:
        token:
          type: string
          enum: [usdc, usdt]
        currency:
          type: string
          enum: [ngn, kes, ghs, idr, php]
        amount:
          type: string
          description: Token amount as a decimal string, never a float. With mode receive it is the local amount the recipient gets.
        payout_type:
          type: string
          enum: [bank, mobile_money]
          default: bank
        source_chain:
          type: string
          description: Chain the funds start on. Defaults to near, the vault's chain.
        mode:
          type: string
          enum: [send, receive]
          default: send
          description: send fixes what the sender pays, receive fixes what the recipient gets
        preference:
          type: string
          enum: [best_rate, most_reliable, fastest]
          default: best_rate
    Fees:
      type: object
      required: [provider, network, total]
      properties:
        provider:
          type: integer
          description: In minor units of the local currency
        network:
          type: integer
        total:
          type: integer
    Route:
      type: object
      required: [provider, status, rate]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        status:
          $ref: "#/components/schemas/ProviderStatus"
        rate:
          type: [number, "null"]
        age_seconds:
          type: integer
        routed:
          type: boolean
        receive:
          type: integer
          description: Whole local currency units this route would pay
        fee:
          type: integer
          description: Total fees of this route in minor units of the local currency
        eta_seconds:
          type: integer
        on_time_percent:
          type: integer
          description: Smoothed 30-day success rate
        less_than_best:
          type: integer
          description: Whole local currency units below the best route, 0 for the best
        via_intents:
          type: boolean
          description: True when the money crosses chains through NEAR Intents before reaching the provider
        not_offered_reason:
          type: [string, "null"]
          enum: [breaker_open, timeout, error, half_open_over_limit, null]
    Quote:
      type: object
      required:
        [
          quote_id,
          token,
          currency,
          amount,
          rate_before_fees,
          fees,
          rate,
          receive,
          provider,
          best_of,
          routes,
          expires_in,
        ]
      properties:
        quote_id:
          type: string
        token:
          type: string
        currency:
          type: string
        amount:
          type: string
        rate_before_fees:
          type: number
        fees:
          $ref: "#/components/schemas/Fees"
        rate:
          type: number
        receive:
          type: integer
          description: Amount that lands, in whole local currency units
        provider:
          $ref: "#/components/schemas/ProviderId"
        best_of:
          type: integer
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        expires_in:
          type: integer
        eta_seconds:
          type: integer
          description: Estimated seconds until the money lands, from the chosen route
        saving_vs_next:
          type: integer
          description: Whole local currency units the chosen route pays over the next best, 0 when there is only one
    Account:
      type: object
      required: [bank, number]
      properties:
        bank:
          type: string
          description: Institution code, for example 058 for GTBank
        number:
          type: string
    VerifiedAccount:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [account_name, institution]
          properties:
            account_name:
              type: string
            institution:
              type: string
            name_verified:
              type: boolean
              description: False when the sender supplied the name because the bank could not look it up
    PayoutRequest:
      type: object
      required: [quote_id, account]
      properties:
        quote_id:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        client_reference:
          type: string
          description: Your own reference. Unique per account, so a second payout with the same one is refused.
        refund_address:
          type: string
          description: Where a failed payout is refunded. Defaults to the signed-in user's fliq name.
        account_name:
          type: string
          description: Only needed when the bank cannot return a name for the account.
        retry_of:
          type: string
          description: The refunded, failed or expired payout this one tries again, quoted with POST /payouts/{payoutId}/retry-quote.
    PayoutState:
      type: string
      enum:
        - created
        - provider_timeout
        - awaiting_recon
        - awaiting_deposit
        - deposit_seen
        - routing
        - with_provider
        - paying_out
        - settled
        - refunding
        - refunded
        - expired
        - failed
        - refused
        - not_received
    StateChange:
      type: object
      required: [state, at]
      properties:
        state:
          $ref: "#/components/schemas/PayoutState"
        at:
          type: string
          format: date-time
    Deposit:
      type: object
      required: [chain, address, amount]
      properties:
        chain:
          type: string
        address:
          type: string
        amount:
          type: string
    Payout:
      type: object
      required:
        [
          payout_id,
          state,
          account_name,
          account,
          amount,
          receive,
          currency,
          rate,
          fees,
          provider,
          deposit,
          history,
        ]
      properties:
        payout_id:
          type: string
        state:
          $ref: "#/components/schemas/PayoutState"
        account_name:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        amount:
          type: string
        receive:
          type: integer
        currency:
          type: string
        rate:
          type: number
        fees:
          $ref: "#/components/schemas/Fees"
        provider:
          $ref: "#/components/schemas/ProviderId"
        deposit:
          $ref: "#/components/schemas/Deposit"
        provider_order:
          type: [string, "null"]
        vault_receipt:
          type: [string, "null"]
        bank_reference:
          type: [string, "null"]
        seconds:
          type: [integer, "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/StateChange"
        failure:
          oneOf:
            - $ref: "#/components/schemas/PayoutFailure"
            - type: "null"
        refund:
          oneOf:
            - $ref: "#/components/schemas/PayoutRefund"
            - type: "null"
        settlement_name:
          type: [string, "null"]
          description: The sender name the recipient's bank alert shows. Null until the provider's is confirmed.
        retry_of:
          type: [string, "null"]
          description: The payout this one tried again
        retried_by:
          type: [string, "null"]
          description: The latest payout that tried this one again
        claim:
          oneOf:
            - $ref: "#/components/schemas/PayoutClaim"
            - type: "null"
    PayoutFailure:
      type: object
      required: [stage, code, at]
      description: Why a payout did not settle. Providers do not say why a bank credit failed, so stage is where it stopped.
      properties:
        stage:
          type: string
          enum: [deposit, routing, provider, bank]
          description: >-
            deposit: nothing was sent in time. routing: NEAR Intents could not deliver to the provider.
            provider: the provider did not start the payout. bank: the provider could not credit the account.
        code:
          type: [string, "null"]
          description: The provider's failure code, when it gave one
        at:
          type: string
          format: date-time
    PayoutRefund:
      type: object
      required: [amount, to, at, tx]
      properties:
        amount:
          type: string
          description: USDC returned, as a decimal string
        to:
          type: string
          enum: [vault, sender]
          description: vault when the payout was paid from the vault, otherwise the refund address
        at:
          type: string
          format: date-time
        tx:
          type: [string, "null"]
          description: The refund transaction, when the provider reported one
    PayoutClaim:
      type: object
      required: [claim_id, payout_id, state, bank_reference, opened_at, reversal_after]
      properties:
        claim_id:
          type: string
        payout_id:
          type: string
        state:
          type: string
          enum: [open, resolved]
        bank_reference:
          type: [string, "null"]
          description: What the recipient gives their bank, for NGN the NIP session id
        opened_at:
          type: string
          format: date-time
        reversal_after:
          type: string
          format: date-time
          description: When a credit that never landed is due to be reversed by the bank rail, 24 hours after settlement
    Refusal:
      type: object
      required: [error, attempted, per_payout_cap, daily_cap, used_today]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        attempted:
          type: integer
          description: Local currency units
        per_payout_cap:
          type: integer
        daily_cap:
          type: integer
        used_today:
          type: integer
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        quote:
          $ref: "#/components/schemas/Quote"
          description: Only with the quote_changed error. A fresh quote to confirm, since the rate moved and nothing was sent.
    PasskeyOptions:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id:
          type: string
          description: Send back with the signed credential
        options:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredentialCreationOptions or RequestOptions as JSON
    PasskeyCredential:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn attestation or assertion as JSON
    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    EmailLinkSent:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [sent]
    EmailLinkToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [user_id, near_account, display_name, photo_url, occupation, vault]
      properties:
        photo_url:
          type: [string, "null"]
          description: https URL of the profile photo the client uploaded to storage
        user_id:
          type: string
        near_account:
          type: [string, "null"]
          description: The claimed name, for example frank.fliq.near. Null until a name is claimed.
        display_name:
          type: [string, "null"]
        occupation:
          type: [string, "null"]
        vault:
          type: [string, "null"]
          description: Vault contract account holding the user's balance. Null until a name is claimed.
    Session:
      type: object
      required: [access_token, expires_in, refresh_token, user]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    NameAvailability:
      type: object
      required: [name, available, reason]
      properties:
        name:
          type: string
          description: Full name, for example frank.fliq.near
        available:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [taken, invalid, reserved, null]
    ClaimNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The label before .fliq.near
    ProfileUpdate:
      type: object
      properties:
        photo_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: https URL of the uploaded photo, or null to remove it
        display_name:
          type: string
        occupation:
          type: [string, "null"]
    WorkspaceUseCase:
      type: string
      enum: [wallet, payroll, marketplace, agent, other]
    PayoutCountry:
      type: string
      enum: [ng, ke, gh, id, ph]
    WorkspaceRequest:
      type: object
      required: [name, use_case, countries]
      properties:
        name:
          type: string
        use_case:
          $ref: "#/components/schemas/WorkspaceUseCase"
        countries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PayoutCountry"
    Workspace:
      type: object
      required: [workspace_id, name, use_case, countries, live_enabled]
      properties:
        live_enabled:
          type: boolean
          description: False until the business passes KYB
        workspace_id:
          type: string
        name:
          type: string
        use_case:
          $ref: "#/components/schemas/WorkspaceUseCase"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/PayoutCountry"
    SandboxKey:
      type: object
      required: [key_id, key]
      properties:
        key_id:
          type: string
        key:
          type: string
          description: Starts with rt_test_. Returned once and never again.
    WorkspaceCreated:
      type: object
      required: [workspace, sandbox_key]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        sandbox_key:
          $ref: "#/components/schemas/SandboxKey"
    ApiKeyView:
      type: object
      required: [key_id, environment, masked, created_at]
      properties:
        key_id:
          type: string
        environment:
          type: string
          enum: [test, live]
        masked:
          type: string
          description: First characters and last four, for example rt_test_7Kp2...c9Qe
        created_at:
          type: string
          format: date-time
    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyView"
    OnboardingStep:
      type: object
      required: [id, done]
      properties:
        id:
          type: string
          enum: [create_test_payout, add_webhook, go_live]
        done:
          type: boolean
    Onboarding:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"
    Bank:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    PayoutSummary:
      type: object
      required: [payout_id, state, account_name, bank, account_last4, amount, receive, currency, provider, created_at]
      properties:
        payout_id:
          type: string
        state:
          $ref: "#/components/schemas/PayoutState"
        account_name:
          type: string
        bank:
          $ref: "#/components/schemas/Bank"
        account_last4:
          type: string
        amount:
          type: string
          description: Token amount as a decimal string
        receive:
          type: integer
          description: Whole local currency units
        currency:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        created_at:
          type: string
          format: date-time
    PayoutList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayoutSummary"
        next_cursor:
          type: [string, "null"]
    CurrencyTotal:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: integer
          description: Whole local currency units
    PayoutCount:
      type: object
      required: [count, totals]
      properties:
        count:
          type: integer
        totals:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyTotal"
    PayoutStats:
      type: object
      required: [timezone, window, settled, median_seconds_to_bank, refused]
      properties:
        timezone:
          type: string
        window:
          type: object
          required: [start, end]
          description: The day being counted, as UTC instants
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        settled:
          $ref: "#/components/schemas/PayoutCount"
        median_seconds_to_bank:
          type: [number, "null"]
          description: Median seconds from deposit seen to the bank credit, for payouts settled today
        refused:
          $ref: "#/components/schemas/PayoutCount"
    AccountLookup:
      type: object
      required: [bank, number]
      properties:
        bank:
          type: string
          description: Institution code, for example 058 for GTBank
        number:
          type: string
        country:
          type: string
          enum: [ng, ke, gh, id, ph]
          default: ng
        account_name:
          type: string
          description: Only needed when the bank cannot return a name for the account. Then name_verified is false.
    Institution:
      type: object
      required: [code, name, type, country, logo_key]
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [bank, mobile_money]
        country:
          type: string
        logo_key:
          type: [string, "null"]
          description: Names the logo asset the apps ship
    InstitutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Institution"
    RecipientBank:
      type: object
      required: [code, name, logo_key]
      properties:
        code:
          type: string
        name:
          type: string
        logo_key:
          type: [string, "null"]
    Recipient:
      type: object
      required: [recipient_id, account_name, bank, account_last4, created_at]
      properties:
        recipient_id:
          type: string
        account_name:
          type: string
        bank:
          $ref: "#/components/schemas/RecipientBank"
        account_last4:
          type: string
        created_at:
          type: string
          format: date-time
    RecipientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
    VaultBalance:
      type: object
      required: [account, available, reserved, total, in_sync]
      properties:
        account:
          type: string
        available:
          type: string
          description: USDC free to spend, as a decimal string
        reserved:
          type: string
          description: USDC held for registered, unexecuted orders
        total:
          type: string
        in_sync:
          type: boolean
          description: False when the ledger mirror disagrees with the chain
    DepositTokenId:
      type: string
      enum: [usdc, usdt, btc]
    DepositChainId:
      type: string
      enum: [base, solana, tron, arbitrum, ethereum, polygon, bitcoin, near]
    DepositSource:
      type: object
      required: [token, chain, group, minimum, eta_seconds, direct, available, address]
      properties:
        token:
          $ref: "#/components/schemas/DepositTokenId"
        chain:
          $ref: "#/components/schemas/DepositChainId"
        group:
          type: string
          enum: [dollars, bitcoin, near]
          description: The heading the app lists the source under
        minimum:
          type: string
          description: Smallest top-up, in the source token
        eta_seconds:
          type: integer
          description: Typical time from sending to landing in the vault
        direct:
          type: boolean
          description: True for the user's own NEAR account, which needs no address reserved
        available:
          type: boolean
          description: False when NEAR Intents does not offer this source right now
        address:
          type: [string, "null"]
          description: For a direct source, the account to send to. Null for the others; reserve one with POST /deposits.
    DepositSourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DepositSource"
    DepositEstimate:
      type: object
      required: [token, chain, amount, minimum, fee, lands, eta_seconds]
      properties:
        token:
          $ref: "#/components/schemas/DepositTokenId"
        chain:
          $ref: "#/components/schemas/DepositChainId"
        amount:
          type: string
          description: What the user said they will send, in the source token
        minimum:
          type: string
          description: Smallest amount the address will take, in the source token
        fee:
          type: string
          description: NEAR Intents and network fees, in US dollars
        lands:
          type: string
          description: USDC the vault receives for amount
        eta_seconds:
          type: integer
    DepositRequest:
      type: object
      additionalProperties: false
      required: [token, chain, amount]
      properties:
        token:
          $ref: "#/components/schemas/DepositTokenId"
        chain:
          $ref: "#/components/schemas/DepositChainId"
        amount:
          type: string
          description: About how much the user will send, in the source token. Any amount from minimum up is taken.
    DepositState:
      type: string
      description: >-
        waiting: nothing has arrived. seen: the transfer is on the source chain. underpaid: less than minimum
        arrived; more can be sent until reserved_until, after that it is refunded. bridging: moving to NEAR.
        landed: in the vault. refunded: returned to the user's NEAR account. expired: nothing arrived in time.
        failed: NEAR Intents could not complete it and support has been told.
      enum: [waiting, seen, underpaid, bridging, landed, refunded, expired, failed]
    VaultDeposit:
      type: object
      required:
        [
          deposit_id,
          state,
          token,
          chain,
          address,
          memo,
          amount,
          minimum,
          fee,
          lands,
          eta_seconds,
          reserved_until,
          received,
          landed,
          refunded,
          seen_at,
          bridging_at,
          landed_at,
          seconds,
          origin_tx,
          created_at,
        ]
      properties:
        deposit_id:
          type: string
        state:
          $ref: "#/components/schemas/DepositState"
        token:
          $ref: "#/components/schemas/DepositTokenId"
        chain:
          $ref: "#/components/schemas/DepositChainId"
        address:
          type: string
          description: Where to send, on chain only
        memo:
          type: [string, "null"]
          description: Must go with the transfer when the chain needs one
        amount:
          type: string
          description: What the user said they would send, in the source token
        minimum:
          type: string
          description: Smallest amount the address takes, in the source token
        fee:
          type: string
          description: Estimated fees for amount, in US dollars
        lands:
          type: string
          description: Estimated USDC for amount. Once landed, the landed field is the real figure.
        eta_seconds:
          type: integer
        reserved_until:
          type: string
          format: date-time
          description: The address is watched until then
        received:
          type: [string, "null"]
          description: What arrived on the source chain, in the source token
        landed:
          type: [string, "null"]
          description: USDC credited to the vault
        refunded:
          type: [string, "null"]
          description: What was returned to the user's NEAR account, in the source token
        seen_at:
          type: [string, "null"]
          format: date-time
        bridging_at:
          type: [string, "null"]
          format: date-time
        landed_at:
          type: [string, "null"]
          format: date-time
        seconds:
          type: [integer, "null"]
          description: From seen to landed
        origin_tx:
          type: [string, "null"]
          description: The transfer's hash on the source chain
        created_at:
          type: string
          format: date-time
    Person:
      type: object
      required: [near_account, display_name, photo_url, member_since]
      properties:
        near_account:
          type: string
        display_name:
          type: [string, "null"]
        photo_url:
          type: [string, "null"]
        member_since:
          type: string
          format: date-time
    RecentPerson:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [last_paid_at]
          properties:
            last_paid_at:
              type: string
              format: date-time
    RecentPeopleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecentPerson"
    StatusDay:
      type: object
      required: [date, status, checks, uptime_percent]
      properties:
        date:
          type: string
          format: date
          description: UTC calendar day
        status:
          type: string
          enum: [operational, degraded, outage, no_data]
        checks:
          type: integer
        uptime_percent:
          type: [number, "null"]
          description: Share of checks that answered, slow or not. Null when nothing ran.
    StatusComponent:
      type: object
      required: [id, name, kind, state, days]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [service, provider]
        state:
          type: string
          enum: [healthy, degraded, down, unknown]
          description: unknown when the last check is more than five minutes old
        days:
          type: array
          items:
            $ref: "#/components/schemas/StatusDay"
    StatusIncident:
      type: object
      required: [incident_id, component, title, impact, state, summary, started_at, resolved_at]
      properties:
        incident_id:
          type: string
        component:
          type: string
        title:
          type: string
        impact:
          type: string
          enum: [degraded, outage]
        state:
          type: string
          enum: [open, resolved]
        summary:
          type: string
        started_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
    StatusReport:
      type: object
      required: [updated_at, components, incidents]
      properties:
        updated_at:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: "#/components/schemas/StatusComponent"
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/StatusIncident"
