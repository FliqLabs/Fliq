name: Bug
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ios, web, api, contract, spec, analytics, ci]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Do X, see Y
    validations:
      required: true
