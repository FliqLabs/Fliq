[package]
name = "fliq-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testing = []

[dependencies]
near-sdk = "5.17.2"

[dev-dependencies]
anyhow = "1"
near-sdk = { version = "5.17.2", features = ["unit-testing"] }
near-workspaces = "0.15"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
