[package]
name = "fliq-vault"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-contract-standards = "=5.30.0"
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
