[package]
name = "fliq-vault"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testing = []

[dependencies]
borsh = "1"
near-contract-standards = "=5.30.0"
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
anyhow = "1"
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }
near-workspaces = "0.15"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
