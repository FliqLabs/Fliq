[package]
name = "fliq-vault"
version = "0.1.0"
edition = "2024"
publish = false
# NEP-330 requires this; it is recorded in the deployed contract's source metadata.
repository = "https://github.com/FliqLabs/Fliq"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build. The image is identified by its digest, not the tag, so two owners
# building the same commit get the same bytes. The inner command says non-reproducible-wasm because
# reproducibility comes from the pinned container, not from the build inside it.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[features]
default = []
testing = []
# Runs tests/workspaces.rs, which embeds the release WASMs from `make build-contract`.
sandbox = []

[dependencies]
borsh = "1"
near-contract-standards = "=5.30.0"
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
anyhow = "1"
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
